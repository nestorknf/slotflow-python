name: Publish to PyPI

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version
        id: version
        run: |
          LOCAL_VERSION=$(python -c "import re; print(re.search(r'version\s*=\s*\"(.+?)\"', open('pyproject.toml').read()).group(1))")
          echo "Local version: $LOCAL_VERSION"

          PUBLISHED_VERSION=$(pip index versions slotflow 2>/dev/null | head -1 | grep -oP '\([\d.]+\)' | tr -d '()' || echo "0.0.0")
          echo "Published version: $PUBLISHED_VERSION"

          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed — will publish $LOCAL_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged — skipping publish"
          fi

      - name: Install build tools
        if: steps.version.outputs.changed == 'true'
        run: pip install build twine

      - name: Build package
        if: steps.version.outputs.changed == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.version.outputs.changed == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
