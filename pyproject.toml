[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slotflow"
version = "0.1.0"
description = "Python SDK for the Slotflow API — scheduling infrastructure for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Slotflow" }]
keywords = ["slotflow", "scheduling", "booking", "ai", "ai-agent", "appointments", "calendar", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "typing_extensions>=4.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://slotflow.dev"
Documentation = "https://docs.slotflow.dev"
Repository = "https://github.com/nestorknf/slotflow-python"
Issues = "https://github.com/nestorknf/slotflow-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
